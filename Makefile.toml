## --- [DOCUMENTATION] ---------------------------------------------------------

[tasks.docs-build]
workspace = false
description = "Build mdBook documentation"
command = "mdbook"
args = ["build"]

[tasks.docs-serve]
workspace = false
description = "Serve mdBook documentation on port 8001"
command = "mdbook"
args = ["serve", "--port", "8001"]

## --- [FRONTEND] --------------------------------------------------------------

[tasks.frontend-install]
workspace = false
description = "Install frontend npm dependencies"
command = "npm"
args = ["install"]
cwd = "frontend"

[tasks.frontend-build]
workspace = false
description = "Build frontend production assets"
dependencies = ["frontend-install"]
command = "npm"
args = ["run", "build"]
cwd = "frontend"

[tasks.dev-frontend]
workspace = false
description = "Run Vite dev server with hot reload"
command = "npm"
args = ["run", "dev"]
cwd = "frontend"

[tasks.frontend-lint]
workspace = false
description = "Lint frontend code"
command = "npm"
args = ["run", "lint"]
cwd = "frontend"

## --- [ASSETS] ----------------------------------------------------------------

[tasks.assets-copy]
workspace = false
description = "Copy frontend build output to lib_web/assets"
dependencies = ["frontend-build"]
script_runner = "@shell"
script = '''
rm -rf backend/libs/lib_web/assets
cp -r frontend/dist backend/libs/lib_web/assets
'''

## --- [APP] -------------------------------------------------------------------

[tasks.dev]
workspace = false
description = "Build frontend, copy assets, then run the app"
dependencies = ["assets-copy"]
command = "cargo"
args = ["run", "-p", "app"]

[tasks.dev-app]
workspace = false
description = "Run the app"
command = "cargo"
args = ["run", "-p", "app"]

[tasks.release]
workspace = false
description = "Build frontend and compile a release binary"
dependencies = ["assets-copy"]
command = "cargo"
args = ["build", "-p", "app", "--release"]

[tasks.run-release]
workspace = false
description = "Build frontend and run the release binary"
dependencies = ["assets-copy"]
command = "cargo"
args = ["run", "-p", "app", "--release"]
