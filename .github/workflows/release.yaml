name: Build Release Binaries

# Triggered when a GitHub Release is published via the Releases UI or API.
# Each entry in the matrix produces one archive attached to the release.
on:
  release:
    types: [created]

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # keep building other targets if one fails
      matrix:
        include:
          - target: x86_64-unknown-linux-musl # statically linked, portable Linux binary
            archive: tar.gz

    steps:
      # Checkout the repository source code.
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Cross-compile the workspace and attach the resulting archive to the
      # GitHub Release. rust-build.action handles toolchain installation,
      # cross-compilation, archiving, and uploading.
      # https://github.com/rust-build/rust-build.action
      - name: Compile binaries and upload to release
        uses: rust-build/rust-build.action@v1.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          RUSTTARGET: ${{ matrix.target }}
          ARCHIVE_TYPES: ${{ matrix.archive }}
          ARCHIVE_NAME: bitnode-console-${{ matrix.target }}
          # Script that runs inside the build container before cargo build.
          # Must be executable (chmod +x) in the repository.
          PRE_BUILD: "./.github/workflows/release-pre.sh"
          # MINIFY: "yes"
          EXTRA_FILES: "README.md LICENSE"
          # Pin to the same Rust version as rust-toolchain.toml.
          TOOLCHAIN_VERSION: 1.95.0
          # Point at the package directly so the action sees a real [package]
          # manifest rather than the virtual workspace root Cargo.toml.
          SRC_DIR: "backend/bins/bin_rpc"
