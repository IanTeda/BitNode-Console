name: Build Release Binaries

# Triggered when a GitHub Release is published via the Releases UI or API.
# Each entry in the matrix produces one archive attached to the release.
on:
  release:
    types: [created]

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # keep building other targets if one fails
      matrix:
        include:
          # x86_64 Linux (glibc). libsystemd is a shared library only — it cannot
          # be statically linked — so musl is not viable for this binary.
          # The app reads systemd journals, so it will only ever run on
          # systemd-based Linux where libsystemd.so is already present.
          - target: x86_64-unknown-linux-gnu
            archive_name: bitnode-console-x86_64-unknown-linux-gnu.tar.gz

    steps:
      # Checkout the repository source code.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install system libraries required by the build.
      # protobuf-compiler / libprotobuf-dev  — prost-build needs protoc to
      #   generate Rust source from .proto files at compile time.
      # libsystemd-dev  — the systemd crate (used by lib_journals) links
      #   against libsystemd; this is the Ubuntu dev package that provides
      #   both the shared library and pkg-config metadata.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libsystemd-dev

      # Register the target with the Rust toolchain installed by rust-toolchain.toml.
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # Build the RPC-only server binary in release mode.
      - name: Build bin_rpc
        run: cargo build --release --target ${{ matrix.target }} --package bin_rpc

      # Bundle the binary and supporting files into a tar.gz archive.
      - name: Create archive
        run: |
          tar -czf ${{ matrix.archive_name }} \
            -C target/${{ matrix.target }}/release bin_rpc \
            README.md LICENSE

      # Attach the archive to the GitHub Release that triggered this workflow.
      # https://github.com/softprops/action-gh-release
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
