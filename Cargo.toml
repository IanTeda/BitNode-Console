# BitNode Console - Cargo Workspace Configuration
#
# BitNode Console is organised as a Cargo workspace to separate code into areas of
# concern and responsibility while sharing common dependencies and configuration.
# This has been done to improve maintainability, modularity, and to allow for code
# reuse across different parts of the code and different projects.

## --- [ WORKSPACE CONFIGURATION ] ---------------------------------------------
# The workspace section defines the overall configuration for the Cargo workspace.
# This allows us to manage multiple related crates together, sharing dependencies
# and settings.
[workspace]

# Resolver version for dependency resolution, when using rust edition 2024 this needs
# to be set to 3 to enable the new features and improvements in dependency resolution.
# https://doc.rust-lang.org/cargo/reference/resolver.html
resolver = "3"

# Crates to be included in the workspace are added here. This config uses a glob
# pattern to include all crates under the `crates/` directory. Each crate should
# have its own Cargo.toml file with its specific configuration and dependencies.
members = [
    "backend/bins/*",
    "backend/libs/*",
]

## --- [ SHARED WORKSPACE METADATA ] -------------------------------------------
# Shared (default) metadata for all workspace members are defined here to ensure
# consistency. Individual crates can override these settings if necessary. Defaults
# will be applied to all members unless overridden in their own Cargo.toml files.
[workspace.package]

description = "BitNode Console is a web-based interface for managing a Bitcoin Knots/Core daemon node. It aims to simplify configuration changes, provide configuration profiles, monitor daemon status, and view logs without needing to enter the command line."

repository = "https://github.com/IanTeda/BitNode-Console"

# Shared (default) binary and library version.
version = "0.1.0"

# Shared (default) rust edition.
edition = "2024"

# Shared (default) authors information.
authors = ["Ian Teda <ian@teda.id.au>"]

# Shared (default) license information.
license = "GPL-3.0-only"

## --- [ SHARED WORKSPACE LINT CONFIGURATION ] ---------------------------------
# Shared (default) lint configuration for all workspace members. This enforcers
# consistent coding standards across the entire project. Individual crates can override
# these settings if necessary, but the defaults will apply to all members unless
# overridden in their own Cargo.toml files.
[workspace.lints.rust]

# Forbid unsafe code across the workspace for safety
unsafe_code = "forbid"

# Allow unused code/variables during development, with low priority to allow overrides
# For exploratory dev, comment out for commits.
# Comment out to enforce unused code checks before commiting to main branch.
unused = { level = "allow", priority = -1 }

# Treat all warnings as errors to enforce code quality and prevent issues from being
# ignored. Uses a lower priority than pedantic/nursery so those lint groups can
# stay at `warn` level without being promoted to error by this catch-all.
warnings = { level = "deny", priority = -2 }

# Silence noisy pedantic/nursery lints that fire heavily on generated code and
# domain code; these are informational, not defects. Keep the rest of pedantic
# and nursery at `warn` (see [workspace.lints.clippy]).

[workspace.lints.clippy]

# Enable pedantic lints to catch more potential issues and enforce stricter coding
# standards. Kept at `warn` level; specific noisy lints are set to `allow` below.
pedantic = { level = "warn", priority = -1 }

# Allow certain clippy lints that may be too strict or not applicable to our codebase,
# with low priority to allow overrides
nursery = { level = "warn", priority = -1 }

# The following pedantic/nursery lints are silenced because they either fire on
# style choices we've already made, on generated code (tonic/prost output), or
# on patterns that are intentional in this codebase. Priority 0 (default) so
# these `allow`s override the `pedantic`/`nursery` group `warn` at priority -1.
use_self = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
doc_markdown = "allow"
derive_partial_eq_without_eq = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
redundant_clone = "allow"
default_constructed_unit_structs = "allow"
match_same_arms = "allow"
significant_drop_tightening = "allow"
pub_underscore_fields = "allow"
unnecessary_wraps = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_fields_in_debug = "allow"
uninlined_format_args = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
unused_async = "allow"
unnecessary_literal_unwrap = "allow"
clone_on_copy = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_wildcard_for_single_variants = "allow"
module_inception = "allow"
needless_lifetimes = "allow"
redundant_pub_crate = "allow"
single_match_else = "allow"
default_trait_access = "allow"
trivially_copy_pass_by_ref = "allow"
ip_constant = "allow"
non_std_lazy_statics = "allow"

## --- [ SHARED WORKSPACE DEPENDENCIES ] ---------------------------------------
# Define shared (default) code dependencies here to ensure consistent versions across
# workspace members.
# In member crates' Cargo.toml, reference them as: serde = { workspace = true }
[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde", "clock"] }
fake = { version = "5.1.0", features = [
    "derive",
    "bigdecimal",
    "chrono",
    "chrono-tz",
    "http",
    "random_color",
    "time",
    "uuid",
] }
secrecy = { version = "0.10.3"}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151" }
prost = { version = "0.14" }
prost-types = { version = "0.14" }
thiserror = { version = "2.0.18" }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1" }
tonic = { version = "0.14.6" }
tonic-build = { version = "0.14.6" }
tonic-prost = { version = "0.14.6" }
tonic-prost-build = { version = "0.14.6" }
tonic-reflection = { version = "0.14.6" }
tonic-web = { version = "0.14.6" }
tracing = { version = "0.1.44" }
uuid = { version = "1.23.4", features = ["v7", "serde"] }
