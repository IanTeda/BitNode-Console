[supervisord]
# Run in the foreground so the container's PID 1 is supervisord itself —
# signals from the container runtime reach it directly.
nodaemon=true
# Send supervisord's own logs to /dev/null; each program below handles its
# own output directly.
logfile=/dev/null
logfile_maxbytes=0

[program:bitcoind]
# Run the Bitcoin Knots/Core daemon pointed at the standard config and data
# directory for the `bitcoin` user.
command=bitcoind -conf=/home/bitcoin/.bitcoin/bitcoin.conf -datadir=/home/bitcoin/.bitcoin
user=bitcoin
autostart=true
# Restart automatically on crash; supervisord handles backoff.
autorestart=true
# Stream stdout/stderr straight to the container log (journald / docker logs).
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bitnode-console]
# Run the BitNode Console binary (serves both HTTP frontend and gRPC backend).
command=bin_console
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
