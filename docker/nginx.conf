# nginx configuration for the BitNode Console frontend container.
# Serves the static Vite build from /usr/share/nginx/html and falls back to
# index.html for all routes so the React router handles client-side navigation.
#
# BITNODE_PORT is injected at container start by entrypoint.frontend.sh;
# the __BITNODE_PORT__ placeholder below is replaced before nginx reads this file.

server {
    # Port is a placeholder replaced at container start by entrypoint.frontend.sh
    # using the BITNODE_PORT environment variable (default 8080).
    listen __BITNODE_PORT__;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fall back to index.html for any path not matched by a real file,
        # which lets the React router handle client-side navigation.
        try_files $uri $uri/ /index.html;
    }
}
